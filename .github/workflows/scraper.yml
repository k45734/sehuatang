name: Sehuatang Auto Scraper

on:
  schedule:
    - cron: '*/30 * * * *'  # 매 6시간마다 실행 (UTC 기준이므로 필요시 시간 조정)
  workflow_dispatch:       # GitHub 웹에서 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # 깃허브 레포지토리에 변경된 파일(rss.xml, db 등)을 다시 쓰기 위한 권한 설정
    permissions:
      contents: write

    steps:
      - name: 레포지토리 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4 feedgen requests-cache requests

      - name: 크롤러 스크립트 실행
        run: python sehuatang.py

      - name: 변경된 파일(rss.xml, sehuatang.db 등) 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 존재하는 파일들만 안전하게 추가 (proxy_page.html 제외)
          git add rss.xml sehuatang.db || true
          
          # 변경 사항이 있을 때만 커밋 수행
          git diff --staged --quiet || git commit -m "Auto: Update RSS and DB [skip ci]"
          
          # 원격 저장소로 푸시
          git push
